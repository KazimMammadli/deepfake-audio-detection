[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-audio-detection"
version = "1.0.0"
description = "Deep learning pipeline and Explainable AI (XAI) system for detecting AI-synthesized speech vs real human speech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kazim Mammadli", email = "kazimmammadli@users.noreply.github.com"}
]
keywords = [
    "deepfake-audio",
    "audio-classification",
    "speech-synthesis",
    "mel-spectrogram",
    "tensorflow",
    "explainable-ai",
    "grad-cam",
    "shap",
    "lime",
    "streamlit"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "tensorflow>=2.13.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "shap>=0.43.0",
    "lime>=0.2.0.1",
    "streamlit>=1.30.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/KazimMammadli/deepfake-audio-detection"
Repository = "https://github.com/KazimMammadli/deepfake-audio-detection.git"
Issues = "https://github.com/KazimMammadli/deepfake-audio-detection/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
